<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DYNEX STATUS Admin</title><style>
:root{--bg:#07070d;--card:#10101a;--line:#29213a;--text:#f6f3ff;--muted:#a9a2b8;--accent:#ff2d75;--accent2:#8b5cf6;--good:#31e981}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 10%,rgba(255,45,117,.16),transparent 32%),radial-gradient(circle at 80% 90%,rgba(139,92,246,.18),transparent 32%),var(--bg);color:var(--text)}.container{width:min(760px,92%);margin:auto;padding:45px 0}.brand{display:flex;align-items:center;gap:15px;margin-bottom:25px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:16px}.brand h1{margin:0;font-size:27px;letter-spacing:1px}.brand h1 span{color:var(--accent)}.brand p{margin:5px 0;color:var(--muted)}.center{justify-content:center;text-align:center}.card{background:rgba(16,16,26,.9);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 0 40px rgba(139,92,246,.08)}h2{margin:12px 0 8px}label{display:block;margin:17px 0 7px;color:#ddd6eb;font-weight:700}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:#090910;color:white;outline:none}input:focus{border-color:var(--accent2)}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;font-weight:800;cursor:pointer}.small{width:auto!important;margin:0 0 0 8px!important}.badge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1.5px;padding:7px 10px;border-radius:999px;background:rgba(255,45,117,.12);color:#ff70a2}.muted{color:var(--muted);line-height:1.55}.result{margin-top:20px;padding:16px;border:1px solid rgba(49,233,129,.25);border-radius:15px;background:rgba(49,233,129,.06)}.linkrow{display:flex;margin-top:10px}.hidden{display:none}.error{margin-top:15px;padding:12px;border-radius:12px;background:rgba(255,70,70,.1);color:#ff9a9a}.topline{display:flex;align-items:center;justify-content:space-between;gap:15px}.state{font-weight:900;font-size:13px;padding:9px 12px;border-radius:999px;background:#29232f;color:#bbb}.state.active{background:rgba(49,233,129,.12);color:var(--good)}.state.disabled{background:rgba(255,70,70,.1);color:#ff8e8e}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}.stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0b0b12}.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}.stat strong{display:block;margin-top:7px;font-size:20px}.progress{height:13px;background:#24202d;border-radius:999px;overflow:hidden}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}@media(max-width:600px){.container{padding:25px 0}.card{padding:18px}.grid{grid-template-columns:1fr}.linkrow{flex-direction:column;gap:8px}.small{width:100%!important;margin:0!important}}

</style></head><body><main class="container"><div class="brand"><img class="dynex-logo" src="/logo.png" alt="DYNEX Configz Logo" onerror="this.style.display='none'"><div><h1>DYNEX <span>STATUS</span></h1><p>Next Level Dynamic Configs</p></div></div><section class="card"><div class="badge">ADMIN PANEL</div><h2>Create Customer Status Link</h2><p class="muted">Original subscription data stays on the server. Customers receive only a DYNEX status link.</p><label>Admin Key</label><input id="key" type="password" placeholder="Your ADMIN_KEY"><label>Customer Name</label><input id="name" placeholder="Customer 01"><label>3X-UI Subscription URL</label><input id="sub" type="url" placeholder="https://your-domain/sub/customer-id"><button id="create">Generate Status Link</button><div id="result" class="result hidden"><b>Customer link:</b><div class="linkrow"><input id="out" readonly><button id="copy" class="small">Copy</button></div></div><div id="error" class="error hidden"></div></section></main><script>const $=id=>document.getElementById(id);$('create').onclick=async()=>{let key=$('key').value.trim(),customerName=$('name').value.trim(),subscriptionUrl=$('sub').value.trim();$('error').classList.add('hidden');$('result').classList.add('hidden');if(!key||!customerName||!subscriptionUrl){$('error').textContent='Please fill all fields.';$('error').classList.remove('hidden');return}let r=await fetch('/api/admin/create',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({customerName,subscriptionUrl})}),d=await r.json();if(!r.ok){$('error').textContent=d.error||'Something went wrong.';$('error').classList.remove('hidden');return}$('out').value=location.origin+d.statusPath;$('result').classList.remove('hidden')};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('out').value);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy',1200)};</script></body></html>
